# Example config for a polar CoreRZ printer: a rotating bed plus an arm
# whose radius (R) and height (Z) are driven by two motors in an H-bot /
# CoreXZ belt layout. Pin mappings are for a BIGTREETECH SKR Pico V1.0
# (see generic-bigtreetech-skr-pico-v1.0.cfg).
#
#   stepper_a = r + z   -> carries the R endstop
#   stepper_b = r - z   -> carries the Z endstop
#
# Bring-up check: with the motors on, G1 X<r> Y0 must move only the arm
# in and out, and G1 Z<z> must move only the arm up and down. If R moves
# when you ask for Z (or the other way round), invert the dir_pin of ONE
# of stepper_a / stepper_b. If both axes move the wrong way, swap the
# motor cables of stepper_a and stepper_b instead.
#
# Polar kinematics are singular at the bed centre (x=0, y=0): the bed
# would have to spin infinitely fast there. Keep first prints away from
# the centre and set max_angular_velocity.
#
# See docs/Config_Reference.md for a description of parameters.

[stepper_bed]
# X driver slot
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
# Pulley teeth on the bed : pulley teeth on the motor - MEASURE YOURS
gear_ratio: 80:16

[tmc2209 stepper_bed]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.580

[stepper_a]
# Y driver slot
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 16
# GT2 belt, 20 tooth pulley
rotation_distance: 40
# R endstop on the X-stop connector, at the outer end of arm travel
endstop_pin: ^gpio4
position_endstop: 150
# position_min may be 0 or negative (arm past the bed centre); homing R
# runs with linear kinematics so it never makes the bed spin
position_min: 0
position_max: 150
homing_speed: 20
homing_retract_dist: 5

[tmc2209 stepper_a]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.580

[stepper_b]
# Z driver slot
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 16
rotation_distance: 40
# Z endstop on the Z-stop connector
endstop_pin: ^gpio25
position_endstop: 0
position_max: 200
homing_speed: 10
homing_retract_dist: 5

[tmc2209 stepper_b]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.580

[extruder]
step_pin: gpio14
dir_pin: !gpio13
enable_pin: !gpio15
microsteps: 16
# Calibrate for your extruder
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio23
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio27
# Run PID_CALIBRATE HEATER=extruder TARGET=210 and SAVE_CONFIG
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 260

[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.650

[fan]
pin: gpio17

[heater_fan hotend_fan]
pin: gpio18

[temperature_sensor pico]
sensor_type: temperature_mcu

[mcu]
# USB. If the Pi is stacked on the Pico's header instead, build Klipper
# for UART0 on GPIO1/GPIO0 and use: serial: /dev/serial0
serial: /dev/serial/by-id/usb-Klipper_rp2040_CHANGE_ME-if00

[printer]
kinematics: polar_corerz
max_velocity: 100
max_accel: 1500
max_z_velocity: 10
max_z_accel: 100
# Caps how fast the bed may spin (rad/s); slows moves near the centre
max_angular_velocity: 6
